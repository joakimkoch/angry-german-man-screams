<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0f">
<title>Herr Ohr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0f; --card:#17171b; --line:#26262c; --fg:#f4f1ea; --mut:#8b8892;
    --gold:#ffce00; --red:#ff3b2f; --skin:#f2b48c; --skin2:#d98f69;
    --lvl:0; /* 0..1 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;overflow-x:hidden;
    padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
  .flag{display:flex;width:64px;height:6px;border-radius:3px;overflow:hidden;margin-bottom:14px}
  .flag i{flex:1}.flag i:nth-child(1){background:#000;border:1px solid #333}.flag i:nth-child(2){background:#dd0000}.flag i:nth-child(3){background:var(--gold)}
  h1{font-family:"Archivo Black",sans-serif;font-size:34px;margin:0;letter-spacing:-.01em;line-height:1}
  .sub{color:var(--mut);font-size:14px;margin:6px 0 0}

  /* Örat */
  .stage{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:18px 0 6px;display:grid;place-items:center}
  .rings{position:absolute;inset:0}
  .rings span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);opacity:0;transform:scale(.6)}
  .loud .rings span{animation:ring 1s ease-out infinite}
  .loud .rings span:nth-child(2){animation-delay:.33s}.loud .rings span:nth-child(3){animation-delay:.66s}
  @keyframes ring{to{opacity:0;transform:scale(1.15)}from{opacity:.7;transform:scale(.6)}}
  #ear{width:72%;transition:transform .15s;transform:scale(calc(1 + var(--lvl)*.12))}
  .loud #ear{animation:shake .12s linear infinite}
  @keyframes shake{0%{translate:-3px 0;rotate:-2deg}50%{translate:3px 0;rotate:2deg}100%{translate:-3px 0;rotate:-2deg}}
  #ear .skin{fill:var(--skin);transition:fill .2s}
  .warm #ear .skin{fill:#f59a7a}
  .loud #ear .skin{fill:#ff6a52}
  #ear .inner{fill:var(--skin2)}
  .bubble{position:absolute;top:2%;right:-4%;background:var(--fg);color:#111;font-weight:600;font-size:15px;
    padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:62%;opacity:0;transform:translateY(8px) scale(.9);
    transition:all .25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
  .bubble.show{opacity:1;transform:none}

  /* Siffran */
  .read{display:flex;align-items:baseline;gap:6px}
  #db{font-family:"Archivo Black",sans-serif;font-size:84px;line-height:.9;font-variant-numeric:tabular-nums;transition:color .2s}
  .warm #db{color:var(--gold)} .loud #db{color:var(--red)}
  .unit{font-size:20px;color:var(--mut);font-weight:600}
  #mood{color:var(--mut);font-size:15px;height:20px;margin-top:6px}

  /* Mätare */
  .meter{width:min(100%,360px);margin:16px 0 18px;position:relative}
  .bars{display:flex;gap:3px;height:34px;align-items:flex-end}
  .bars i{flex:1;background:var(--line);border-radius:2px;height:30%;transition:background .08s,height .08s}
  .thr{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg);border-radius:1px}
  .thr::after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap}
  .scale{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:6px}

  button.main{font:600 18px Inter,sans-serif;border:0;border-radius:18px;padding:18px;width:min(100%,360px);
    background:var(--gold);color:#111;box-shadow:0 6px 0 #b38f00;transition:transform .05s,box-shadow .05s}
  button.main:active{transform:translateY(4px);box-shadow:0 2px 0 #b38f00}
  button.main.on{background:var(--card);color:var(--fg);box-shadow:0 6px 0 #000;border:1px solid var(--line)}
  .stats{display:flex;gap:10px;width:min(100%,360px);margin-top:16px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-family:"Archivo Black",sans-serif;font-size:22px}
  .stat span{font-size:12px;color:var(--mut)}

  details{width:min(100%,360px);margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
  summary{cursor:pointer;padding:10px 0;color:var(--mut);font-size:14px;list-style:none}
  summary::after{content:"＋";float:right}details[open] summary::after{content:"－"}
  .row{margin:6px 0 14px}
  .row label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
  .row label b{color:var(--fg)}
  input[type=range]{width:100%;accent-color:var(--gold)}
  select{width:100%;font:inherit;font-size:14px;padding:9px;border-radius:10px;background:#0f0f12;color:var(--fg);border:1px solid var(--line)}
  .ghost{width:100%;font:600 14px Inter,sans-serif;padding:11px;border-radius:10px;background:transparent;color:var(--fg);border:1px solid var(--line);margin-bottom:12px}
  #err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;max-width:360px;min-height:1em}
  #flash{position:fixed;inset:0;background:var(--red);opacity:0;pointer-events:none;transition:opacity .5s}
</style>
</head>
<body>
<div id="flash"></div>
<div class="flag"><i></i><i></i><i></i></div>
<h1>HERR OHR</h1>
<p class="sub">Ein sehr empfindliches Ohr.</p>

<div class="stage" id="stage">
  <div class="rings"><span></span><span></span><span></span></div>
  <svg id="ear" viewBox="0 0 200 240" aria-hidden="true">
    <path class="skin" d="M100 12c-50 0-82 36-82 84 0 30 12 50 26 66 12 14 14 26 16 40 4 22 20 34 40 34 22 0 36-16 36-34 0-14-8-20-8-34 0-16 30-30 30-72C158 46 140 12 100 12z"/>
    <path class="inner" d="M100 40c-34 0-56 24-56 56 0 18 8 30 18 40 8 8 6 20 18 22 10 2 14-8 12-18-2-12-14-14-14-30 0-18 12-32 30-32 16 0 26 10 26 24 0 12-8 16-8 26 0 8 10 10 14 2 6-12 14-18 14-34 0-34-24-56-54-56z"/>
    <ellipse cx="96" cy="108" rx="11" ry="15" fill="#5a2a1a" opacity=".55"/>
    <!-- ansikte -->
    <g id="face" fill="#2a1410">
      <circle id="eyeL" cx="76" cy="190" r="4"/><circle id="eyeR" cx="112" cy="190" r="4"/>
      <path id="mouth" d="M84 210q10 6 20 0" stroke="#2a1410" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="bubble" id="bubble">Thank you for screaming in my ear.</div>
</div>

<div class="read"><div id="db">--</div><div class="unit">dB</div></div>
<div id="mood">Tryck på start, bitte.</div>

<div class="meter">
  <div class="bars" id="bars"></div>
  <div class="thr" id="thr"></div>
  <div class="scale"><span>30</span><span>60</span><span>90</span><span>120</span></div>
</div>

<button class="main" id="go">Starta Herr Ohr</button>

<div class="stats">
  <div class="stat"><b id="peak">–</b><span>Högsta dB</span></div>
  <div class="stat"><b id="count">0</b><span>Gånger skrikit</span></div>
</div>

<details>
  <summary>Inställningar</summary>
  <div class="row">
    <label>Gräns för ”för högt” <b><span id="thrVal">80</span> dB</b></label>
    <input id="thrIn" type="range" min="50" max="110" value="80">
  </div>
  <div class="row">
    <label>Kalibrering <b><span id="calVal">+0</span> dB</b></label>
    <input id="calIn" type="range" min="-20" max="20" value="0">
  </div>
  <div class="row" id="voiceRow">
    <label>Reservröst (om ingen inspelning finns)</label>
    <select id="voiceSel"></select>
  </div>
  <button class="ghost" id="test">🔊 Testa rösten</button>
</details>
<div id="err"></div>

<script>
/* Inbyggd röst (base64-ljud). Tom = använd talsyntes som reserv. */
const VOICE_B64 = "";
const VOICE_MIME = "audio/mp4";

const LINE = "Thank you for screaming in my ear.";
const MIN_DB = 30, MAX_DB = 120, N_BARS = 36;
const BASE_OFFSET = 100, HOLD_MS = 350, COOLDOWN_MS = 5000;
const MOODS = [
  [0,  "Ruhig. Herr Ohr slumrar."],
  [50, "Angenehm. Fortsätt så."],
  [65, "Hmm. Lite högljutt nu."],
  [-10,"Achtung! Nära gränsen…"],
  [0,  "AUA! Für das Ohr!"]
];
const $ = id => document.getElementById(id);

/* ---------- Mätarstaplar ---------- */
const bars = [];
for (let i = 0; i < N_BARS; i++) { const b = document.createElement("i"); $("bars").appendChild(b); bars.push(b); }

let threshold = 80, calib = 0;
try { threshold = +(localStorage.getItem("thr") || 80); calib = +(localStorage.getItem("cal") || 0); } catch(e){}
$("thrIn").value = threshold; $("calIn").value = calib; labels();
$("thrIn").oninput = e => { threshold = +e.target.value; save(); labels(); };
$("calIn").oninput = e => { calib = +e.target.value; save(); labels(); };
function save(){ try{ localStorage.setItem("thr",threshold); localStorage.setItem("cal",calib);}catch(e){} }
function labels(){
  $("thrVal").textContent = threshold;
  $("calVal").textContent = (calib>=0?"+":"")+calib;
  const f = (threshold-MIN_DB)/(MAX_DB-MIN_DB);
  $("thr").style.left = `calc(${f*100}% - 1px)`; $("thr").dataset.v = threshold + " dB";
}

/* ---------- Röst ---------- */
let clip = null;
if (VOICE_B64) {
  const bin = atob(VOICE_B64), arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  clip = new Audio(URL.createObjectURL(new Blob([arr],{type:VOICE_MIME})));
  clip.preload = "auto"; clip.playsInline = true;
  $("voiceRow").style.display = "none";
}
const MALE = /markus|yannick|stefan|conrad|killian|florian|hans|jonas|male|mann/i;
let voices = [], chosen = null;
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const de = voices.filter(v => /^de/i.test(v.lang)).sort((a,b)=>(MALE.test(b.name)?1:0)-(MALE.test(a.name)?1:0));
  const sel = $("voiceSel"); sel.innerHTML = "";
  (de.length?de:voices).forEach(v => { const o=document.createElement("option"); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o); });
  let saved=null; try{saved=localStorage.getItem("voice");}catch(e){}
  chosen = voices.find(v=>v.name===saved) || de[0] || null;
  if (chosen) sel.value = chosen.name;
}
$("voiceSel").onchange = e => { chosen = voices.find(v=>v.name===e.target.value); try{localStorage.setItem("voice",chosen.name);}catch(_){} };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

let speaking = false, lastSpoke = 0;
function done(){ speaking = false; lastSpoke = performance.now(); }
function speak(){
  speaking = true;
  if (clip) { clip.currentTime = 0; clip.onended = clip.onerror = done; clip.play().catch(done); return; }
  if (!("speechSynthesis" in window)) return done();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(LINE);
  if (chosen) { u.voice = chosen; u.lang = chosen.lang; } else u.lang = "de-DE";
  u.pitch = chosen && MALE.test(chosen.name) ? 0.9 : 0.5; u.rate = 0.92;
  u.onend = u.onerror = done; speechSynthesis.speak(u);
}
$("test").onclick = () => { speak(); showBubble(); };

/* ---------- Mikrofon ---------- */
let ctx, analyser, stream, raf, buf, smooth = 0, peak = 0, overSince = 0, count = 0;
$("go").onclick = () => stream ? stop() : start();

async function start(){
  $("err").textContent = "";
  try {
    if ("speechSynthesis" in window && !clip) { const w = new SpeechSynthesisUtterance(" "); w.volume = 0; speechSynthesis.speak(w); }
    if (clip) { clip.muted = true; clip.play().then(()=>{clip.pause(); clip.muted=false;}).catch(()=>{clip.muted=false;}); }
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
    ctx = new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048; buf = new Float32Array(analyser.fftSize);
    ctx.createMediaStreamSource(stream).connect(analyser);
    $("go").textContent = "Stoppa"; $("go").classList.add("on");
    loop();
  } catch(e) {
    stream = null;
    $("err").textContent = "Mikrofonen gick inte att starta. Öppna sidan via https och tillåt mikrofonen.";
  }
}
function stop(){
  cancelAnimationFrame(raf); stream.getTracks().forEach(t=>t.stop()); stream = null;
  ctx && ctx.close(); $("go").textContent = "Starta Herr Ohr"; $("go").classList.remove("on");
  $("db").textContent = "--"; render(MIN_DB); $("mood").textContent = "Herr Ohr vilar.";
}

function loop(){
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for (let i=0;i<buf.length;i++) s += buf[i]*buf[i];
  const db = Math.max(0, 20*Math.log10(Math.max(Math.sqrt(s/buf.length),1e-8)) + BASE_OFFSET + calib);
  smooth = smooth ? smooth*.8 + db*.2 : db;
  if (smooth > peak) { peak = smooth; $("peak").textContent = Math.round(peak); }
  $("db").textContent = Math.round(smooth);
  render(smooth);

  const now = performance.now();
  if (!speaking && smooth >= threshold) {
    if (!overSince) overSince = now;
    if (now - overSince > HOLD_MS && now - lastSpoke > COOLDOWN_MS) trigger();
  } else overSince = 0;
  raf = requestAnimationFrame(loop);
}

function render(db){
  const f = Math.min(1, Math.max(0, (db-MIN_DB)/(MAX_DB-MIN_DB)));
  document.documentElement.style.setProperty("--lvl", f);
  const lit = Math.round(f*N_BARS), thrBar = (threshold-MIN_DB)/(MAX_DB-MIN_DB)*N_BARS;
  bars.forEach((b,i) => {
    const on = i < lit;
    b.style.height = on ? (40 + i/N_BARS*60) + "%" : "30%";
    b.style.background = !on ? "var(--line)" : i >= thrBar ? "var(--red)" : i >= thrBar-4 ? "var(--gold)" : "var(--fg)";
  });
  const st = $("stage"), loud = db >= threshold, warm = !loud && db >= threshold-10;
  st.classList.toggle("loud", loud); st.classList.toggle("warm", warm);
  document.body.classList.toggle("warm", warm); document.body.classList.toggle("loud", loud);
  // ansikte
  $("mouth").setAttribute("d", loud ? "M86 214q8-12 16 0z" : warm ? "M84 212h20" : "M84 210q10 6 20 0");
  $("eyeL").setAttribute("r", loud ? 2 : 4); $("eyeR").setAttribute("r", loud ? 2 : 4);
  if (stream) $("mood").textContent = loud ? MOODS[4][1] : warm ? MOODS[3][1] : db >= 65 ? MOODS[2][1] : db >= 50 ? MOODS[1][1] : MOODS[0][1];
}

function showBubble(){ $("bubble").classList.add("show"); setTimeout(()=>$("bubble").classList.remove("show"), 3500); }
function trigger(){
  lastSpoke = performance.now(); overSince = 0;
  $("count").textContent = ++count;
  speak(); showBubble();
  $("flash").style.opacity = .35; setTimeout(()=>$("flash").style.opacity = 0, 350);
  if (navigator.vibrate) navigator.vibrate([120,60,120]);
}
render(MIN_DB);
</script>
</body>
</html>
