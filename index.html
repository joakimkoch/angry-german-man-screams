<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Dezibel-Meister</title>
<style>
  :root { --bg:#111; --fg:#f2f2f2; --mut:#8a8a8a; --ok:#3ccf6e; --warn:#f2c230; --bad:#ff4a3d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center;
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px); }
  h1 { font-size:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); margin:0 0 10px; }
  #gauge { position:relative; width:min(80vw,340px); aspect-ratio:1; margin:10px 0; }
  #gauge svg { width:100%; height:100%; }
  #readout { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #db { font-size:72px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  #unit { color:var(--mut); font-size:16px; margin-top:4px; }
  #peak { color:var(--mut); font-size:13px; margin-top:8px; }
  #flash { position:fixed; inset:0; background:var(--bad); opacity:0; pointer-events:none; transition:opacity .4s; }
  #quote { min-height:48px; font-size:18px; font-style:italic; text-align:center; margin:6px 0 14px; color:var(--bad); }
  button { font:inherit; font-weight:700; font-size:18px; border:0; border-radius:14px;
    padding:16px 28px; background:var(--fg); color:var(--bg); width:min(100%,340px); }
  button.stop { background:#333; color:var(--fg); }
  .row { width:min(100%,340px); margin-top:18px; }
  .row label { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); margin-bottom:6px; }
  .row label b { color:var(--fg); }
  input[type=range] { width:100%; accent-color:var(--bad); }
  select { width:100%; font:inherit; font-size:14px; padding:8px; border-radius:10px; background:#222; color:var(--fg); border:1px solid #333; }
  #err { color:var(--bad); font-size:14px; text-align:center; margin-top:12px; max-width:340px; }
  .btns { display:flex; gap:8px; }
  .small { flex:1; font-size:14px; font-weight:600; padding:10px; border-radius:10px; background:#222; color:var(--fg);
    border:1px solid #333; text-align:center; width:auto; display:block; margin:0; cursor:pointer; }
  #clear { flex:0 0 44px; }
  #rec.on { background:var(--bad); color:#fff; }
  .chk { display:flex !important; justify-content:flex-start !important; gap:8px; align-items:center; margin-top:10px; }
  #test { background:transparent; color:var(--mut); border:1px solid #333; font-size:14px; padding:10px; margin-top:12px; }
</style>
</head>
<body>
<div id="flash"></div>
<h1>Dezibel-Meister</h1>

<div id="gauge">
  <svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="86" fill="none" stroke="#222" stroke-width="14"
      stroke-dasharray="405 541" transform="rotate(135 100 100)" stroke-linecap="round"/>
    <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="var(--ok)" stroke-width="14"
      stroke-dasharray="0 541" transform="rotate(135 100 100)" stroke-linecap="round"/>
    <line id="thr" x1="100" y1="6" x2="100" y2="24" stroke="var(--bad)" stroke-width="3" transform="rotate(0 100 100)"/>
  </svg>
  <div id="readout">
    <div id="db">--</div>
    <div id="unit">dB</div>
    <div id="peak">max --</div>
  </div>
</div>

<div id="quote"></div>
<button id="go">Starta</button>

<div class="row">
  <label>Gräns för ”för högt” <b><span id="thrVal">80</span> dB</b></label>
  <input id="thrIn" type="range" min="50" max="110" value="80">
</div>
<div class="row">
  <label>Kalibrering <b><span id="calVal">+0</span> dB</b></label>
  <input id="calIn" type="range" min="-20" max="20" value="0">
</div>
<div class="row">
  <label>Röst</label>
  <select id="voiceSel"></select>
</div>
<div class="row">
  <label>Egen röstfil <b id="clipState">ingen</b></label>
  <div class="btns">
    <button id="rec" class="small">⏺ Spela in</button>
    <label class="small filebtn">📁 Ljudfil<input type="file" accept="audio/*" id="file" hidden></label>
    <button id="clear" class="small">✕</button>
  </div>
  <label class="chk"><input type="checkbox" id="deep" checked> Mörkare röst (sänker tonen på egen fil)</label>
</div>
<button id="test">🔊 Testa rösten</button>
<div id="err"></div>

<script>
const LINE = "Thank you for screaming in my ear.";
const MIN_DB = 30, MAX_DB = 120, ARC = 405;
const BASE_OFFSET = 100;          // dBFS → ungefärlig dB SPL för typiska mobilmikrofoner
const HOLD_MS = 350;              // så länge det måste vara för högt
const COOLDOWN_MS = 5000;         // paus mellan utbrotten

const $ = id => document.getElementById(id);
let ctx, analyser, stream, raf, buf;
let smooth = 0, peak = 0, overSince = 0, lastSpoke = 0, speaking = false;
let threshold = 80, calib = 0, voices = [], chosen = null;

try {
  threshold = +(localStorage.getItem("thr") || 80);
  calib = +(localStorage.getItem("cal") || 0);
} catch (e) {}
$("thrIn").value = threshold; $("calIn").value = calib;
updateLabels();

$("thrIn").oninput = e => { threshold = +e.target.value; save(); updateLabels(); };
$("calIn").oninput = e => { calib = +e.target.value; save(); updateLabels(); };
function save(){ try { localStorage.setItem("thr", threshold); localStorage.setItem("cal", calib); } catch(e){} }
function updateLabels(){
  $("thrVal").textContent = threshold;
  $("calVal").textContent = (calib >= 0 ? "+" : "") + calib;
  const deg = ((threshold - MIN_DB) / (MAX_DB - MIN_DB)) * 270 - 135;
  $("thr").setAttribute("transform", `rotate(${deg} 100 100)`);
}

/* ---------- Röst: tysk man ---------- */
const MALE_HINTS = /markus|yannick|stefan|conrad|killian|florian|hans|jonas|male|mann|männlich/i;
const FEMALE_HINTS = /anna|petra|helena|katja|hedda|marlene|vicki|female|frau|weiblich/i;
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const de = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("de"));
  const ranked = [...de].sort((a,b) => score(b) - score(a));
  const sel = $("voiceSel"); sel.innerHTML = "";
  (ranked.length ? ranked : voices).forEach((v,i) => {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o);
  });
  let saved = null; try { saved = localStorage.getItem("voice"); } catch(e){}
  chosen = voices.find(v => v.name === saved) || ranked[0] || null;
  if (chosen) sel.value = chosen.name;
  if (!de.length) $("err").textContent = "Ingen tysk röst hittades på enheten – lägg till en tysk röst (t.ex. ”Markus”) i telefonens inställningar för talat innehåll.";
}
function score(v){ return (MALE_HINTS.test(v.name)?10:0) - (FEMALE_HINTS.test(v.name)?10:0) + (v.localService?1:0) + (/enhanced|premium|förbättrad/i.test(v.name)?2:0); }
$("voiceSel").onchange = e => { chosen = voices.find(v => v.name === e.target.value); try{localStorage.setItem("voice", chosen.name);}catch(_){} };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

/* ---------- Egen röstfil (sparas i webbläsaren) ---------- */
let clipUrl = null, recorder = null;
const audioEl = new Audio(); audioEl.preload = "auto"; audioEl.playsInline = true;
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open("dezibel", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function putClip(b){ try { const db = await idb(); const t = db.transaction("kv","readwrite");
  b ? t.objectStore("kv").put(b, "clip") : t.objectStore("kv").delete("clip"); } catch(e){} }
async function getClip(){ try { const db = await idb(); return await new Promise(r => {
  const q = db.transaction("kv").objectStore("kv").get("clip"); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch(e){ return null; } }
function setClip(b){
  if (clipUrl) URL.revokeObjectURL(clipUrl);
  clipUrl = b ? URL.createObjectURL(b) : null;
  audioEl.src = clipUrl || "";
  $("clipState").textContent = b ? "används ✓" : "ingen";
}
getClip().then(setClip);

$("file").onchange = e => { const f = e.target.files[0]; if (f) { setClip(f); putClip(f); } };
$("clear").onclick = () => { setClip(null); putClip(null); };
$("rec").onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  try {
    const s = stream || await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(s);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const b = new Blob(chunks, { type: recorder.mimeType || "audio/mp4" });
      if (s !== stream) s.getTracks().forEach(t => t.stop());
      recorder = null; lastSpoke = performance.now(); $("rec").classList.remove("on"); $("rec").textContent = "⏺ Spela in";
      setClip(b); putClip(b);
    };
    recorder.start(); $("rec").classList.add("on"); $("rec").textContent = "⏹ Stoppa";
    lastSpoke = performance.now() + 60000; // trigga inte medan du spelar in
    setTimeout(() => recorder && recorder.stop(), 6000);
  } catch(e) { $("err").textContent = "Kunde inte spela in – tillåt mikrofonen (kräver https)."; }
};
function applyDeep(){
  const deep = $("deep").checked;
  audioEl.preservesPitch = audioEl.mozPreservesPitch = audioEl.webkitPreservesPitch = !deep;
  audioEl.playbackRate = deep ? 0.82 : 1;
}

function speak(){
  if (clipUrl) {
    applyDeep();
    speaking = true;
    audioEl.currentTime = 0;
    audioEl.onended = audioEl.onerror = () => { speaking = false; lastSpoke = performance.now(); };
    audioEl.play().catch(() => { speaking = false; lastSpoke = performance.now(); });
    return;
  }
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(LINE);
  if (chosen) { u.voice = chosen; u.lang = chosen.lang; } else { u.lang = "de-DE"; }
  const male = chosen && MALE_HINTS.test(chosen.name);
  u.pitch = male ? 0.9 : 0.55;   // sänk tonläget om det inte är en manlig röst
  u.rate = 0.92; u.volume = 1;
  u.onstart = () => { speaking = true; };
  u.onend = u.onerror = () => { speaking = false; lastSpoke = performance.now(); };
  speechSynthesis.speak(u);
}
$("test").onclick = () => speak();

/* ---------- Mätning ---------- */
$("go").onclick = async () => { stream ? stop() : start(); };

async function start(){
  $("err").textContent = "";
  try {
    // "väck" talsyntesen inom användarklicket (krävs i iOS)
    if ("speechSynthesis" in window) { const w = new SpeechSynthesisUtterance(" "); w.volume = 0; speechSynthesis.speak(w); }
    if (clipUrl) { audioEl.muted = true; audioEl.play().then(() => { audioEl.pause(); audioEl.muted = false; }).catch(() => { audioEl.muted = false; }); }
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    peak = 0; smooth = 0;
    $("go").textContent = "Stoppa"; $("go").classList.add("stop");
    loop();
  } catch (e) {
    stream = null;
    $("err").textContent = "Kunde inte starta mikrofonen. Sidan måste öppnas via https (eller localhost) och du måste tillåta mikrofonåtkomst.";
  }
}
function stop(){
  cancelAnimationFrame(raf);
  stream.getTracks().forEach(t => t.stop()); stream = null;
  ctx && ctx.close(); ctx = null;
  $("go").textContent = "Starta"; $("go").classList.remove("stop");
  $("db").textContent = "--";
  setArc(MIN_DB);
}

function loop(){
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i]*buf[i];
  const rms = Math.sqrt(sum / buf.length);
  const dbfs = 20 * Math.log10(Math.max(rms, 1e-8));
  const db = Math.max(0, dbfs + BASE_OFFSET + calib);
  smooth = smooth ? smooth*0.8 + db*0.2 : db;
  peak = Math.max(peak, smooth);

  $("db").textContent = Math.round(smooth);
  $("peak").textContent = "max " + Math.round(peak);
  setArc(smooth);

  const now = performance.now();
  // ignorera ljud medan rösten själv pratar
  if (!speaking && smooth >= threshold) {
    if (!overSince) overSince = now;
    if (now - overSince > HOLD_MS && now - lastSpoke > COOLDOWN_MS) trigger();
  } else overSince = 0;

  raf = requestAnimationFrame(loop);
}

function setArc(db){
  const f = Math.min(1, Math.max(0, (db - MIN_DB) / (MAX_DB - MIN_DB)));
  const arc = $("arc");
  arc.setAttribute("stroke-dasharray", `${f*ARC} 541`);
  arc.setAttribute("stroke", db >= threshold ? "var(--bad)" : db >= threshold - 10 ? "var(--warn)" : "var(--ok)");
  $("db").style.color = db >= threshold ? "var(--bad)" : "var(--fg)";
}

function trigger(){
  lastSpoke = performance.now(); overSince = 0;
  speak();
  $("quote").textContent = "„" + LINE + "“";
  $("flash").style.opacity = .35;
  setTimeout(() => $("flash").style.opacity = 0, 400);
  if (navigator.vibrate) navigator.vibrate(200);
  setTimeout(() => $("quote").textContent = "", 4000);
}
</script>
</body>
</html>
